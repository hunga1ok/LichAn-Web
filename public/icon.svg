<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9C7718"/>
      <stop offset="50%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#5C450C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="120" y1="80" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Nền hình vuông bo góc hiện đại -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Vành viền chỉ vàng kim -->
  <rect x="20" y="20" width="472" height="472" rx="96" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="190" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.4"/>

  <!-- Trăng khuyết & Mặt trời âm dương cổ truyền -->
  <path d="M256 100 C170 100 100 170 100 256 C100 342 170 412 256 412 C230 380 216 338 216 292 C216 200 278 126 362 106 C330 102 294 100 256 100 Z" fill="url(#goldGrad)" opacity="0.3" filter="url(#shadow)"/>

  <!-- Chữ "An" thư pháp Việt -->
  <text x="256" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="bold" fill="#FEF7E6" text-anchor="middle" filter="url(#shadow)">
    An
  </text>
  
  <!-- Họa tiết điểm xuyết phía dưới chữ -->
  <path d="M206 370 Q256 385 306 370" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="385" r="4" fill="#D4A017"/>
</svg>